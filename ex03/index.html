<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Colors System</title>
		<link rel="stylesheet" href="style.css">
	</head>

	<body>
		<h1> Color System </h1>
		<br>
		<h2>I- Color Swatch Palette</h2>
		<h3> ** Color System : Named </h3>

		<div>
			<div class="Named-color-red"></div>
			<div class="Named-color-pink"></div>
			<div class="Named-color-orange"></div>
			<div class="Named-color-yellow"></div>
			<div class="Named-color-green"></div>
		</div>
		<h3> ** Color System : HEX </h3>

                <div>
                        <div class="HEX-color-red"></div>
                        <div class="HEX-color-pink"></div>
                        <div class="HEX-color-orange"></div>
                        <div class="HEX-color-yellow"></div>
                        <div class="HEX-color-green"></div>
                </div>
                <h3> ** Color System : RGB </h3>

                <div>
                        <div class="RGB-color-red"></div>
                        <div class="RGB-color-pink"></div>
                        <div class="RGB-color-orange"></div>
                        <div class="RGB-color-yellow"></div>
                        <div class="RGB-color-green"></div>
                </div>
                <h3> ** Color System : RGBA</h3>
		<h5> Note : RGBA :With opacity = 1</h5>

                <div>
                        <div class="RGBA-color-red"></div>
                        <div class="RGBA-color-pink"></div>
                        <div class="RGBA-color-orange"></div>
                        <div class="RGBA-color-yellow"></div>
                        <div class="RGBA-color-green"></div>
                </div>

		<br>
		<hr>
		<h2>II- Opacity VS background-color: rgba(..., 0.5)</h2>

		<div>
			<h3> ** With opacity : (0.5)</h3>
			<div class="using-opacity">
				<div class="RGB-color-green"></div>
                        	<div class="RGB-color-pink"></div>
                        	<div class="RGB-color-orange"></div>
                        	<div class="RGB-color-yellow"></div>
                        	<div class="Named-color-black"></div>
			</div>
			<br>
			<h3> ** With background-color (0.5) :</h3>
			<div class="using-background">
				<div class="RGB-color-green"></div>
                                <div class="RGB-color-pink"></div>
                                <div class="RGB-color-orange"></div>
                                <div class="RGB-color-yellow"></div>
                                <div class="Named-color-black"></div>
			</div>
		</div>



	</body>
</html>
